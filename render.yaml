# Render "Blueprint": tells Render how to build and run the shop.
# In the Render dashboard choose New → Blueprint and pick this repository.
# Step-by-step guide: DEPLOY.md
services:
  - type: web
    name: layerforge
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      # Signs the login cookies. Render makes up a strong random value for you.
      - key: JWT_SECRET
        generateValue: true
      # Your MongoDB Atlas connection string (Render asks for it during setup).
      - key: MONGO_URI
        sync: false
      # From https://dashboard.razorpay.com/app/keys. Leave empty for cash on delivery only.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
